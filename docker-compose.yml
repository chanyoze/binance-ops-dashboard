# ============================================================
#  docker compose up  ->  Postgres · 마이그레이션 · 수집기 · 대시보드가 함께 뜹니다.
#
#    대시보드  http://localhost:3000   (WEB_PORT 로 바꿀 수 있습니다)
#
#  기동 순서는 depends_on 이 강제합니다:
#    postgres(healthy) -> migrate(정상 종료) -> collector · web
#  스키마 생성을 수집기 부팅의 부수효과로 두면, 수집기가 못 뜰 때
#  대시보드까지 함께 죽습니다. 그래서 공유 단계로 분리했습니다.
#
#  collector 는 restart: unless-stopped 로 설정되어 있어,
#  프로세스가 죽어도 다시 뜨고 부팅 시퀀스가 누락 구간을 백필합니다.
#  (docs/DECISIONS.md D-02, D-12)
#
#  포트 3000 이 이미 쓰이고 있으면 `up` 이 실패합니다. .env 의 WEB_PORT 를 바꾸세요.
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: binance-ops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-binance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-binance}
      POSTGRES_DB: ${POSTGRES_DB:-binance_ops}
      # 시계열 정합성을 위해 컨테이너 타임존을 UTC 로 고정합니다.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # collector 가 DB 준비 완료 후에 뜨도록 보장합니다.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-binance} -d ${POSTGRES_DB:-binance_ops}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # 스키마 생성. 한 번 돌고 끝나는 서비스입니다.
  #
  # 마이그레이션을 수집기 부팅의 **부수효과**로 두면, 수집기가 못 뜨는 상황
  # (네트워크 차단, 잘못된 Binance 엔드포인트, 크래시 루프)에서 스키마가 영영
  # 생기지 않고 대시보드도 함께 죽습니다. 두 프로세스가 공통으로 의존하는 단계이므로
  # 별도 서비스로 올려 둘 다 이것이 끝난 뒤에 뜨게 합니다.
  #
  # 수집기 코드에도 runMigrations 가 남아 있습니다 — compose 밖에서 단독 실행할 때를
  # 위한 것이고, 마이그레이션은 멱등이라 두 번 돌아도 안전합니다.
  migrate:
    build:
      context: .
      dockerfile: apps/collector/Dockerfile
    container_name: binance-ops-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-binance}:${POSTGRES_PASSWORD:-binance}@postgres:5432/${POSTGRES_DB:-binance_ops}
      TZ: UTC
    command: ["npm", "run", "db:migrate"]

  collector:
    build:
      context: .
      dockerfile: apps/collector/Dockerfile
    container_name: binance-ops-collector
    # 크래시하면 자동 재시작 -> 부팅 시퀀스가 갭을 백필합니다.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-binance}:${POSTGRES_PASSWORD:-binance}@postgres:5432/${POSTGRES_DB:-binance_ops}
      SYMBOLS: ${SYMBOLS:-BTCUSDT,ETHUSDT}
      KLINE_INTERVAL: ${KLINE_INTERVAL:-1m}
      BACKFILL_DAYS: ${BACKFILL_DAYS:-7}
      STALE_THRESHOLD_MS: ${STALE_THRESHOLD_MS:-10000}
      RECONNECT_BASE_MS: ${RECONNECT_BASE_MS:-1000}
      RECONNECT_MAX_MS: ${RECONNECT_MAX_MS:-30000}
      INTEGRITY_SCAN_INTERVAL_MS: ${INTEGRITY_SCAN_INTERVAL_MS:-60000}
      BINANCE_REST_BASE: ${BINANCE_REST_BASE:-https://api.binance.com}
      BINANCE_WS_BASE: ${BINANCE_WS_BASE:-wss://stream.binance.com:9443}
      RATE_LIMIT_WEIGHT_PER_MIN: ${RATE_LIMIT_WEIGHT_PER_MIN:-6000}
      RATE_LIMIT_SOFT_THRESHOLD: ${RATE_LIMIT_SOFT_THRESHOLD:-0.8}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: UTC

  # 대시보드. 수집기와 **별도 프로세스**인 것이 이 구조의 요점입니다 —
  # 장기 실행 WS 연결과 웹 요청 처리는 생명주기가 다릅니다. 웹은 배포마다 재시작되고
  # 트래픽에 따라 복제될 수 있지만, 수집기는 무중단이어야 하고 복제하면 중복 수집이 됩니다.
  #
  # 이 파일은 데모용이라 웹도 한 대로 고정합니다(container_name + 고정 호스트 포트).
  # 실제로 복제하려면 그 둘을 빼고 앞에 로드밸런서를 두면 됩니다 —
  # 코드는 그대로입니다. 상태를 프로세스에 두지 않았기 때문입니다.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: binance-ops-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # 스키마가 없으면 대시보드는 첫 화면부터 500 입니다.
      migrate:
        condition: service_completed_successfully
    ports:
      # 왼쪽이 호스트 포트입니다. 3000 이 이미 쓰이면 .env 에서 WEB_PORT 만 바꾸세요.
      # 컨테이너 안쪽은 3000 으로 고정입니다 — 헬스체크와 매핑이 같은 값을 봐야 합니다.
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-binance}:${POSTGRES_PASSWORD:-binance}@postgres:5432/${POSTGRES_DB:-binance_ops}
      # 화면에 어떤 심볼을 그릴지, 어떤 해상도를 원본으로 볼지는
      # 수집기와 **같은 값**이어야 합니다. 어긋나면 차트가 조용히 빕니다.
      SYMBOLS: ${SYMBOLS:-BTCUSDT,ETHUSDT}
      KLINE_INTERVAL: ${KLINE_INTERVAL:-1m}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: UTC
    healthcheck:
      # 전용 헬스 엔드포인트를 씁니다. /api/dashboard 를 쓰면 15초마다 커버리지·상대강도
      # 같은 무거운 집계를 아무도 안 보는데도 계속 돌려 수집기의 쓰기와 경합합니다.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
