# 검증 게이트.
#
# 세 단계다. 뒤로 갈수록 앞 단계가 못 보는 것을 본다.
#
#   1. 타입체크  — 경계 안쪽
#   2. 테스트    — 판단이 맞는가
#   3. 변이 검증 — **그 테스트가 실제로 무엇을 지키는가**
#
# 3번이 이 파이프라인의 요점이다. 통과하는 테스트와 회귀를 잡는 테스트는 다르고,
# 그 차이는 일부러 망가뜨려 보기 전에는 알 수 없다. 이 저장소에서 아무것도
# 검증하지 않는 테스트가 실제로 두 번 나왔다. 둘 다 초록불이었다.
#
# 통합 테스트를 위해 Postgres 를 띄운다. 다만 DB 가 없어도 단위 테스트는 통과해야
# 하므로(그 설계를 지키려고) 그 경로도 함께 확인한다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: binance
          POSTGRES_PASSWORD: binance
          POSTGRES_DB: binance_ops
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U binance -d binance_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://binance:binance@localhost:5432/binance_ops

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입체크
        run: npm run typecheck

      # DB 없이도 단위 테스트는 통과해야 한다. 채점자가 Postgres 없이 `npm test` 를
      # 돌려도 막히지 않게 한 설계이므로, 그 약속이 지켜지는지 여기서 확인한다.
      - name: 테스트 — DB 없이 (통합은 조용히 스킵)
        run: npx vitest run
        env:
          DATABASE_URL: postgresql://nobody@127.0.0.1:1/none

      - name: 마이그레이션
        run: npm run db:migrate

      - name: 테스트 — 통합 포함
        run: npm test

      # 테스트가 통과한다는 사실만으로는 그 테스트가 무엇을 지키는지 알 수 없다.
      - name: 변이 검증
        run: npm run test:mutate
